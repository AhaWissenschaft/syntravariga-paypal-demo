<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SyntraVariga Rechnungsprüfung – Sandbox</title><style>body{font:16px system-ui;max-width:820px;margin:2rem auto;padding:0 1rem;background:#f4f6fa;color:#182332}main{background:white;padding:1.5rem;border-radius:12px}label{display:block;font-weight:600;margin:1rem 0 .3rem}input{width:100%;box-sizing:border-box;padding:.7rem;font:inherit}button{padding:.7rem 1rem;background:#164b91;color:white;border:0;border-radius:6px;margin-top:1rem}#result{padding:1rem;background:#eff3fa;margin-top:1rem;white-space:pre-wrap}.note{color:#6b4a00;background:#fff3ce;padding:1rem}</style></head><body><main><h1>SyntraVariga – Rechnungsprüfung</h1><p>AhaWissenschaft · PayPal Sandbox</p><p class="note">Demo mit erfundenen Angaben. Die Regeln prüfen eingegebene Felder und Rechenwege. Sie bestätigen weder Echtheit noch Betrugsfreiheit. Eine Sandbox-Zahlung wird nur durch deinen Klick auf PayPal ausgelöst.</p><form id="review"><label>Erwarteter Lieferant<input name="expected_vendor" value="Demo GmbH" required></label><label>Lieferant auf Rechnung<input name="vendor" value="Demo GmbH" required></label><label>Erwarteter Bruttobetrag (EUR)<input name="expected_amount" value="119.00" required></label><label>Rechnungsbetrag (EUR)<input name="amount" value="119.00" required></label><label>Netto (EUR)<input name="net_amount" value="100.00" required></label><label>Steuer (EUR)<input name="tax_amount" value="19.00" required></label><label>Brutto (EUR)<input name="gross_amount" value="119.00" required></label><label>Rechnungsnummer<input name="invoice_number" value="DEMO-001" required></label><button>Felder prüfen</button></form><div id="result">Prüfung starten.</div><div id="paypal-button-container"></div><p id="payment-status"></p></main><script src="https://www.paypal.com/sdk/js?client-id=sb&currency=EUR&intent=capture"></script><script>let receipt=null;const form=document.querySelector('#review'),result=document.querySelector('#result'),status=document.querySelector('#payment-status'),box=document.querySelector('#paypal-button-container');form.addEventListener('input',()=>{receipt=null;box.replaceChildren();status.textContent='';});form.addEventListener('submit',async e=>{e.preventDefault();receipt=null;box.replaceChildren();status.textContent='';try{const data=Object.fromEntries(new FormData(form));const r=await fetch('/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error();const v=await r.json();result.textContent=v.status+'\\n'+v.explanation+'\\n'+(v.findings.length?v.findings.map(x=>x.code+': '+x.message).join('\\n'):'Keine Abweichung in den geprüften Eingabefeldern.')+'\\nLedger-Beleg: '+v.receipt.event_hash;receipt=v.receipt;if(v.status==='FIELDS_CONSISTENT'&&window.paypal){paypal.Buttons({createOrder:async()=>{const x=await fetch('/paypal/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({receipt})});if(!x.ok)throw Error();return (await x.json()).id;},onApprove:async(data)=>{const x=await fetch('/paypal/capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({receipt,order_id:data.orderID})});if(!x.ok)throw Error();const out=await x.json();status.textContent='Sandbox-Status: '+out.status+' · Transaktion: '+(out.purchase_units?.[0]?.payments?.captures?.[0]?.id||out.id);},onError:()=>status.textContent='Sandbox-Ablauf fehlgeschlagen; bitte Status prüfen.'}).render('#paypal-button-container');}}catch(err){result.textContent='Prüfung oder Sandbox-Anfrage fehlgeschlagen.';}});</script></body></html>
